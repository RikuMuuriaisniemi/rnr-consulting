services:
  postgres:
    image: postgres:16-alpine
    container_name: azure-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: POSTGRESQLlokaaliPass
      POSTGRES_DB: azure_practice_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
